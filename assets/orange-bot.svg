<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" shape-rendering="crispEdges">
  <style>
    .slide  { animation: slide  9s linear infinite; }
    .bounce { animation: bounce 0.45s ease-in-out infinite alternate; }
    .walk-l { animation: walkl  0.4s linear infinite; }
    .walk-r { animation: walkr  0.4s linear infinite; }
    .sh     { transform-box:fill-box; transform-origin:50% 50%;
              animation: sh 0.45s ease-in-out infinite alternate; }

    @keyframes slide  { 0%{transform:translate(-100px,90px)} 100%{transform:translate(1000px,90px)} }
    @keyframes bounce { 0%{transform:translateY(0px)}        100%{transform:translateY(-9px)} }
    @keyframes walkl  { 0%,49%{transform:translateY(0px)} 50%,100%{transform:translateY(5px)} }
    @keyframes walkr  { 0%,49%{transform:translateY(5px)} 50%,100%{transform:translateY(0px)} }
    @keyframes sh     { 0%{transform:scaleX(1);opacity:.14}  100%{transform:scaleX(.5);opacity:.05} }
  </style>

  <rect width="900" height="130" fill="none"/>
  <line x1="0" y1="124" x2="900" y2="124"
        stroke="#CC6D52" stroke-width="1" stroke-dasharray="8,8" opacity="0.2"/>

  <g class="slide">
    <!-- ground shadow -->
    <ellipse class="sh" cx="0" cy="33" rx="28" ry="5" fill="#CC6D52"/>

    <g class="bounce">

      <!-- ── left arm (side extension) ── -->
      <rect x="-34" y="-3" width="10" height="14" fill="#CC6D52"/>
      <!-- ── right arm (side extension) ── -->
      <rect x="24"  y="-3" width="10" height="14" fill="#CC6D52"/>

      <!-- ── main body ── -->
      <rect x="-24" y="-16" width="48" height="32" fill="#CC6D52"/>

      <!-- ── eye cutouts (black, like the image) ── -->
      <rect x="-15" y="-12" width="7" height="12" fill="black"/>
      <rect x="8"   y="-12" width="7" height="12" fill="black"/>

      <!-- ── legs: left pair ── -->
      <g class="walk-l">
        <rect x="-18" y="16" width="7" height="15" fill="#CC6D52"/>
        <rect x="-7"  y="16" width="7" height="15" fill="#CC6D52"/>
      </g>
      <!-- ── legs: right pair ── -->
      <g class="walk-r">
        <rect x="0"  y="16" width="7" height="15" fill="#CC6D52"/>
        <rect x="11" y="16" width="7" height="15" fill="#CC6D52"/>
      </g>

    </g>
  </g>
</svg>

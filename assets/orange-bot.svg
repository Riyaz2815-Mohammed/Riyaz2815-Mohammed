<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" shape-rendering="crispEdges">
  <style>
    .slide  { animation: slide  9s linear infinite; }
    .bounce { animation: bounce 0.5s ease-in-out infinite alternate; }
    .walk-l { animation: walkl  0.45s linear infinite; }
    .walk-r { animation: walkr  0.45s linear infinite; }
    .sh     { transform-box:fill-box; transform-origin:50% 50%;
              animation: sh 0.5s ease-in-out infinite alternate; }

    @keyframes slide  { 0%{transform:translate(-110px,120px)} 100%{transform:translate(1010px,120px)} }
    @keyframes bounce { 0%{transform:translateY(0px)}         100%{transform:translateY(-14px)} }
    @keyframes walkl  { 0%,49%{transform:translateY(0)}       50%,100%{transform:translateY(8px)} }
    @keyframes walkr  { 0%,49%{transform:translateY(8px)}     50%,100%{transform:translateY(0)} }
    @keyframes sh     { 0%{transform:scaleX(1);opacity:.12}   100%{transform:scaleX(.5);opacity:.04} }
  </style>

  <rect width="900" height="180" fill="none"/>
  <line x1="0" y1="174" x2="900" y2="174"
        stroke="#CC6D52" stroke-width="1" stroke-dasharray="8,8" opacity="0.18"/>

  <g class="slide">
    <ellipse class="sh" cx="0" cy="48" rx="42" ry="7" fill="#CC6D52"/>

    <g class="bounce">
      <!-- left arm -->
      <rect x="-60" y="-8"  width="18" height="16" fill="#CC6D52"/>
      <!-- right arm -->
      <rect x="42"  y="-8"  width="18" height="16" fill="#CC6D52"/>
      <!-- body (2:1 ratio matching the official pixel-art) -->
      <rect x="-42" y="-21" width="84" height="42" fill="#CC6D52"/>
      <!-- eye cutouts -->
      <rect x="-24" y="-14" width="13" height="20" fill="black"/>
      <rect x="7"   y="-14" width="13" height="20" fill="black"/>
      <!-- left leg pair -->
      <g class="walk-l">
        <rect x="-36" y="21" width="11" height="24" fill="#CC6D52"/>
        <rect x="-20" y="21" width="11" height="24" fill="#CC6D52"/>
      </g>
      <!-- right leg pair -->
      <g class="walk-r">
        <rect x="9"  y="21" width="11" height="24" fill="#CC6D52"/>
        <rect x="25" y="21" width="11" height="24" fill="#CC6D52"/>
      </g>
    </g>
  </g>
</svg>
